name: Update AnimeAI Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOSTNAME: ${{ secrets.HOSTNAME }}
      FEED_URI: ${{ secrets.FEED_URI }}
      BSKY_APP_USERNAME: ${{ secrets.BSKY_APP_USERNAME }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔮 Generate feed and reject log
        run: python -m scripts.generate_feed

      - name: 🤖 Commit & Push feed
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "AnimeAI Bot"
          git config user.email "bot@trevorion.io"
          git add feed.json
          git commit -m "🔄 Auto-update feed"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/PhantomBlackOP/AnimeAI.git" HEAD:main
