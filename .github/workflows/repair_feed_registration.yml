name: Repair existing AnimeAI Bluesky feed registration

on:
  push:
    paths:
      - '.github/workflows/repair_feed_registration.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Update the existing record only after live generator health and DID checks pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BSKY_APP_USERNAME: ${{ secrets.BSKY_APP_USERNAME }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bluesky SDK
        run: python -m pip install "atproto>=0.0.60,<1"
      - name: Verify live service and current feed before any changes
        run: |
          for i in $(seq 1 15); do
            if python scripts/repair_feed_registration.py; then
              exit 0
            fi
            echo "SiteGround redeploy or DID propagation may be in progress. Retrying validation."
            sleep 10
          done
          exit 1
      - name: Repair original feed record after successful validation
        if: ${{ github.event_name == 'push' || inputs.apply }}
        run: python scripts/repair_feed_registration.py --apply
