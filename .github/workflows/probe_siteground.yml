name: Probe SiteGround AnimeAI host

on:
  push:
    paths:
      - '.github/workflows/probe_siteground.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify permanent DNS, homepage, HTTPS and ATProto generator
        run: |
          python - <<'PY'
          import json
          import socket
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          host = "bsky.trevorion.io"
          origin = "https://" + host
          expected_ip = "34.1.230.193"
          feed_uri = "at://did:plc:c36xxd4j5cyfojgcfgwt7fd5/app.bsky.feed.generator/animeai"
          service_did = "did:web:animeai.trevorion.io"

          def check():
              ips = sorted({entry[4][0] for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print("DNS IPs:", ", ".join(ips), flush=True)
              if expected_ip not in ips:
                  raise RuntimeError("Expected Squarespace A record not resolved")

              def fetch(path):
                  req = urllib.request.Request(origin + path, headers={
                      "Accept": "application/json",
                      "User-Agent": "AnimeAI-permanent-host-read-only-check/1.0",
                  })
                  with urllib.request.urlopen(req, timeout=12) as response:
                      if response.status != 200:
                          raise RuntimeError("HTTP " + str(response.status) + " for " + path)
                      return json.load(response)

              health = fetch("/health")
              print("HEALTH:", health, flush=True)
              if health.get("status") != "ok" or health.get("posts", 0) < 1:
                  raise RuntimeError("Health endpoint does not report active feed")

              desc = fetch("/xrpc/app.bsky.feed.describeFeedGenerator")
              print("DESCRIPTION:", desc, flush=True)
              if desc.get("did") != service_did or {"uri": feed_uri} not in desc.get("feeds", []):
                  raise RuntimeError("Wrong service DID or feed URI")

              query = urllib.parse.urlencode({"feed": feed_uri, "limit": 2})
              skeleton = fetch("/xrpc/app.bsky.feed.getFeedSkeleton?" + query)
              print("SKELETON SAMPLE:", skeleton, flush=True)
              if not skeleton.get("feed") or not all(
                  isinstance(post.get("post"), str) and
                  post["post"].startswith("at://did:") and
                  "/app.bsky.feed.post/" in post["post"]
                  for post in skeleton["feed"]
              ):
                  raise RuntimeError("Generator returned no valid ATProto posts")
              req = urllib.request.Request(origin + "/", headers={
                  "Accept": "text/html",
                  "User-Agent": "AnimeAI-permanent-host-read-only-check/1.0",
              })
              with urllib.request.urlopen(req, timeout=12) as response:
                  if response.status != 200 or "text/html" not in response.headers.get("Content-Type", ""):
                      raise RuntimeError("Homepage must return HTTP 200 HTML")
                  page = response.read(200_000).decode("utf-8")
              for phrase in ("<h1>ANIMEAI</h1>", "Where anime meets AI.", "Recent artwork", "Latest posts",
                             "bsky.app/profile/trevorion.io/feed/animeai"):
                  if phrase not in page:
                      raise RuntimeError("Homepage missing expected content: " + phrase)
              if '<script src="/animeai-home.js" defer></script>' not in page:
                  raise RuntimeError("Shared index.html script missing from homepage")
              if 'id="latest-posts"' not in page or 'id="art-gallery"' not in page:
                  raise RuntimeError("Homepage dynamic preview containers missing")
              with urllib.request.urlopen(origin + "/animeai-home.js", timeout=12) as response:
                  if response.status != 200 or "javascript" not in response.headers.get("Content-Type", ""):
                      raise RuntimeError("Homepage renderer JavaScript not served")
                  script = response.read(100_000).decode("utf-8")
              if 'function renderPosts' not in script or 'post-with-image' not in script:
                  raise RuntimeError("Latest-post thumbnail rendering code missing")
              print("SHARED INDEX.HTML AND THUMBNAIL RENDERER VERIFIED", flush=True)
              print("PUBLIC HOMEPAGE VERIFIED, BYTES:", len(page), flush=True)
              print("PERMANENT HOST FULLY VERIFIED", flush=True)

          for attempt in range(1, 10):
              try:
                  print("CHECK ATTEMPT", attempt, flush=True)
                  check()
                  break
              except Exception as exc:
                  print("NOT YET VERIFIED:", type(exc).__name__, str(exc)[:250], flush=True)
                  if attempt == 9:
                      raise
                  time.sleep(12)
          PY
