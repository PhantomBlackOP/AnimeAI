name: Verify AnimeAI website consistency

on:
  push:
    paths:
      - 'index.html'
      - 'animeai-home.js'
      - 'siteground-generator.mjs'
      - '.github/workflows/verify_site_unification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify both websites share index.html and public feed data
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          domains = ("https://animeai.trevorion.io", "https://bsky.trevorion.io")
          feed_uri = "at://did:plc:c36xxd4j5cyfojgcfgwt7fd5/app.bsky.feed.generator/animeai"

          def read(url, accept):
              req = urllib.request.Request(url, headers={
                  "Accept": accept,
                  "User-Agent": "AnimeAI-shared-index-verifier/1.0",
              })
              with urllib.request.urlopen(req, timeout=12) as resp:
                  if resp.status != 200:
                      raise RuntimeError(f"Unexpected HTTP {resp.status}: {url}")
                  return resp.headers.get("Content-Type", ""), resp.read(4_000_000).decode("utf-8")

          for attempt in range(1, 16):
              try:
                  pages = []
                  scripts = []
                  for origin in domains:
                      kind, html = read(origin + "/", "text/html")
                      assert "text/html" in kind, f"Missing HTML: {origin}"
                      assert "<h1>ANIMEAI</h1>" in html
                      assert '<script src="/animeai-home.js" defer></script>' in html
                      assert 'id="latest-posts"' in html
                      assert 'id="art-gallery"' in html
                      assert 'http-equiv="refresh"' not in html
                      pages.append(html)

                      kind, script = read(origin + "/animeai-home.js", "text/javascript")
                      assert "javascript" in kind
                      assert "function renderPosts" in script
                      scripts.append(script)

                      kind, raw = read(origin + "/feed.json", "application/json")
                      assert "json" in kind
                      entries = json.loads(raw)
                      assert isinstance(entries, list) and len(entries) > 0
                      print(origin, "index, script, feed valid; posts:", len(entries), flush=True)

                  assert pages[0] == pages[1], "The two public index.html files differ"
                  assert scripts[0] == scripts[1], "The two public animeai-home.js versions differ"
                  print("BOTH DOMAINS SERVE THE SAME INDEX.HTML AND SCRIPT", flush=True)

                  _, doc = read(domains[0] + "/.well-known/did.json", "application/json")
                  did = json.loads(doc)
                  assert did["id"] == "did:web:animeai.trevorion.io"
                  assert did["service"][0]["serviceEndpoint"] == domains[1]
                  print("BLUESKY SERVICE DID PRESERVED", flush=True)

                  _, desc = read(domains[1] + "/xrpc/app.bsky.feed.describeFeedGenerator", "application/json")
                  generator = json.loads(desc)
                  assert {"uri": feed_uri} in generator["feeds"]
                  print("BLUESKY GENERATOR PRESERVED", flush=True)
                  print("UNIFIED WEBSITE VERIFIED", flush=True)
                  break
              except Exception as exc:
                  print(f"Attempt {attempt} pending: {type(exc).__name__}: {str(exc)[:210]}", flush=True)
                  if attempt == 15:
                      raise
                  time.sleep(10)
          PY
