name: Verify AnimeAI website consistency

on:
  push:
    paths:
      - 'index.html'
      - 'siteground-homepage.html'
      - '.github/workflows/verify_site_unification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check legacy redirect, service DID and live homepage
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          old = "https://animeai.trevorion.io"
          new = "https://bsky.trevorion.io"
          old_feed = "https://bsky.app/profile/trevorion.io/feed/animeai"
          wanted_redirect = 'content="0; url=https://bsky.trevorion.io/"'

          def get(url, accept):
              req = urllib.request.Request(url, headers={
                  "Accept": accept,
                  "User-Agent": "AnimeAI-website-consistency-check/1.0",
              })
              with urllib.request.urlopen(req, timeout=12) as resp:
                  if resp.status != 200:
                      raise RuntimeError(url + " returned " + str(resp.status))
                  return resp.headers.get("Content-Type", ""), resp.read(3_000_000).decode("utf-8")

          for attempt in range(1, 13):
              try:
                  ct, page = get(old + "/", "text/html")
                  assert "text/html" in ct
                  assert wanted_redirect in page, "Legacy homepage has not deployed its redirect"
                  assert 'rel="canonical" href="https://bsky.trevorion.io/"' in page
                  print("LEGACY HOMEPAGE REDIRECT VERIFIED")

                  _, raw_did = get(old + "/.well-known/did.json", "application/json")
                  did = json.loads(raw_did)
                  assert did["id"] == "did:web:animeai.trevorion.io"
                  assert did["service"][0]["serviceEndpoint"] == new
                  print("PUBLIC SERVICE DID UNCHANGED AND VERIFIED")

                  _, raw_posts = get(old + "/feed.json", "application/json")
                  feed = json.loads(raw_posts)
                  assert isinstance(feed, list) and feed
                  print("STATIC FEED.JSON PRESERVED; POST COUNT:", len(feed))

                  ct, homepage = get(new + "/", "text/html")
                  assert "text/html" in ct
                  assert "<h1>ANIMEAI</h1>" in homepage
                  assert old_feed in homepage
                  assert '<a href="https://animeai.trevorion.io/feed.json">Feed JSON</a>' in homepage
                  assert '<a href="https://animeai.trevorion.io/">AnimeAI website</a>' not in homepage
                  print("LIVE WEBSITE FOOTER VERIFIED")
                  print("WEBSITE UNIFICATION VERIFIED")
                  break
              except Exception as err:
                  print(f"Attempt {attempt}: {type(err).__name__}: {str(err)[:200]}", flush=True)
                  if attempt == 12:
                      raise
                  time.sleep(10)
          PY
