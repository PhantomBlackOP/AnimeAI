name: Test AnimeAI SiteGround generator

on:
  push:
    paths:
      - 'siteground-generator.mjs'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/test_generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generator against current GitHub feed.json
        run: npm test
